name: d2s-metal

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner label
        default: macos-15-intel

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build D2SMetal.bundle executable
        run: bash tools/d2s-metal/build.sh 2>&1 | tee tools/d2s-metal/out-build.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2s-metal
          path: |
            tools/d2s-metal/out/
            tools/d2s-metal/out-build.log
